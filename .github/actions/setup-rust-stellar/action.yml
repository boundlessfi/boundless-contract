name: Setup Rust and Stellar
description: Installs Rust toolchain and Stellar CLI
runs:
  using: composite
  steps:
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef 

    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c 
      with:
        toolchain: stable
        targets: wasm32v1-none

    - name: Add wasm32v1-none target
      run: rustup target add wasm32v1-none
      shell: bash

    - name: Install Stellar CLI
      run: |
        STELLAR_VERSION="23.1.3"
        STELLAR_TAR="stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        STELLAR_SHA256="2eb70d75d8f7da3ca9c1f6a69e5055f686cfc8f3ef8e7e06dd10a45e33d3476e"
        
        wget -q "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/${STELLAR_TAR}"
        
        # Verify SHA-256 checksum
        echo "${STELLAR_SHA256}  ${STELLAR_TAR}" | sha256sum -c - || {
          echo "::error::Stellar CLI tarball checksum verification failed"
          exit 1
        }
        
        # Extract with restrictive permissions
        tar xf "${STELLAR_TAR}" --no-same-owner --no-same-permissions -C /tmp
        sudo mv /tmp/stellar /usr/local/bin/
        stellar --version
      shell: bash


